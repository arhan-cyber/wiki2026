<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mineral Oil Coolant Map</title>
<style>
#cpfd{
  --ink:#0f172a; --ink2:#475569; --ink3:#64748b; --line:#e2e8f0; --card:#ffffff; --bg:#f8fafc;
  --step:#a9e2f7; --stepS:#3c9ccc; --io:#fde3a7; --ioS:#e0a73a; --util:#ede9fe; --utilS:#7c3aed; --accent:#ea580c;
  font-family: system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink); background:var(--bg); line-height:1.45; padding:20px 16px 28px; box-sizing:border-box;
}
#cpfd *{box-sizing:border-box}
#cpfd h2{font-size:clamp(20px,2.4vw,28px); margin:0 0 4px; letter-spacing:-.01em; font-weight:750}
#cpfd .lede{color:var(--ink2); margin:0 0 16px; max-width:78ch; font-size:15px}
#cpfd .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin-bottom:14px}
#cpfd .kpi{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px}
#cpfd .kpi b{display:block; font-size:20px; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
#cpfd .kpi span{font-size:12px; color:var(--ink3)}
#cpfd .kpi i{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:6px}
#cpfd .bar{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:6px 0 10px}
#cpfd .seg{display:inline-flex; background:#e2e8f0; border-radius:9px; padding:3px; flex-wrap:wrap}
#cpfd .seg button{all:unset; cursor:pointer; padding:6px 11px; border-radius:7px; font-size:13px; color:var(--ink2); font-weight:550}
#cpfd .seg button[aria-pressed="true"]{background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(15,23,42,.15)}
#cpfd .seg button:focus-visible{outline:2px solid var(--accent)}
#cpfd .hint{font-size:12.5px; color:var(--ink3)}
#cpfd .legend{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink3); flex-wrap:wrap}
#cpfd .ramp{width:140px; height:10px; border-radius:3px}
#cpfd .main{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:14px; align-items:start}
#cpfd .stage{background:var(--card); border:1px solid var(--line); border-radius:12px; overflow-x:auto}
#cpfd svg.pfd{display:block; width:100%; min-width:720px; height:auto}
#cpfd .panel{position:sticky; top:12px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; max-height:calc(100vh - 24px); overflow:auto}
@media (max-width:1100px){ #cpfd .main{grid-template-columns:1fr} #cpfd .panel{position:static; max-height:none} }
#cpfd .n{cursor:pointer; outline:none}
#cpfd .n .sh{transition:fill .25s, stroke .2s, opacity .2s; stroke-width:1.4}
#cpfd .n .id{font-weight:750; fill:var(--ink); pointer-events:none}
#cpfd .n .sub{fill:#1e293b; font-weight:600; pointer-events:none}
#cpfd .n .val{font-size:12px; font-weight:700; pointer-events:none; font-variant-numeric:tabular-nums}
#cpfd .n:hover .sh, #cpfd .n:focus .sh, #cpfd .n.on .sh{stroke:var(--accent)!important; stroke-width:3}
#cpfd .e{fill:none; stroke:#334155; stroke-width:1.3; transition:stroke .2s, opacity .2s}
#cpfd .e.u{stroke:#7c3aed; stroke-dasharray:5 4}
#cpfd .e.hl{stroke:var(--accent); stroke-width:2.6}
#cpfd svg.dim .n:not(.rel) .sh{opacity:.35}
#cpfd svg.dim .e:not(.hl){opacity:.25}
#cpfd .lab{font-size:12.5px; font-weight:650; fill:#1e293b; pointer-events:none}
#cpfd .lab.u{fill:#6d28d9; font-weight:600; font-size:11.5px}
#cpfd .p-kind{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink3); font-weight:700}
#cpfd .p-title{font-size:18px; font-weight:750; margin:2px 0 2px; line-height:1.25}
#cpfd .p-sub{font-size:13px; color:var(--ink2); margin-bottom:8px}
#cpfd .p-desc{font-size:13.5px; color:#334155; margin:0 0 12px}
#cpfd .co2{background:#fff7ed; border:1px solid #fed7aa; border-radius:10px; padding:10px 12px; margin-bottom:12px}
#cpfd .co2.zero{background:#f8fafc; border-color:#e2e8f0}
#cpfd .co2 .big{font-size:24px; font-weight:780; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
#cpfd .co2 .u{font-size:12px; color:var(--ink2); font-weight:600}
#cpfd .meter{height:6px; background:#fde4cc; border-radius:3px; margin:6px 0 4px; overflow:hidden}
#cpfd .meter > div{height:100%; background:var(--accent); border-radius:3px}
#cpfd .co2 small{font-size:12px; color:var(--ink2); display:block}
#cpfd .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:12px}
#cpfd .cell{border:1px solid var(--line); border-radius:8px; padding:7px 8px}
#cpfd .cell b{display:block; font-size:15px; font-variant-numeric:tabular-nums}
#cpfd .cell span{font-size:11px; color:var(--ink3)}
#cpfd .cell.z b{color:#94a3b8; font-weight:600}
#cpfd h4{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink3); margin:14px 0 6px}
#cpfd table{width:100%; border-collapse:collapse; font-size:13px}
#cpfd td{padding:5px 0; border-bottom:1px solid #f1f5f9; vertical-align:top}
#cpfd td.r{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; padding-left:8px; font-weight:600}
#cpfd .src{font-size:9.5px; font-weight:700; border-radius:4px; padding:1px 5px; margin-left:5px; vertical-align:1px}
#cpfd .src.LCA{background:#ffedd5; color:#9a3412}
#cpfd .src.Route{background:#e0f2fe; color:#075985}
#cpfd .sys{background:#f1f5f9; border-radius:8px; padding:8px 10px; font-size:12.5px; color:#334155; margin-top:12px}
#cpfd .rank{list-style:none; margin:0; padding:0}
#cpfd .rank li{display:grid; grid-template-columns:92px 1fr 64px; gap:8px; align-items:center; font-size:12.5px; padding:4px 0; cursor:pointer; border-radius:6px}
#cpfd .rank li:hover{background:#f8fafc}
#cpfd .rank .t{height:8px; background:#f1f5f9; border-radius:4px; overflow:hidden}
#cpfd .rank .t div{height:100%; background:var(--accent)}
#cpfd .rank .v{text-align:right; font-variant-numeric:tabular-nums; font-weight:650}
#cpfd .stack{display:flex; height:14px; border-radius:4px; overflow:hidden; margin:6px 0 6px}
#cpfd .sl{display:grid; grid-template-columns:14px 1fr auto; gap:6px; font-size:12.5px; padding:2px 0}
#cpfd .sl i{width:10px; height:10px; border-radius:2px; margin-top:4px}
#cpfd .sl b{font-variant-numeric:tabular-nums}
#cpfd details{margin-top:16px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; font-size:13.5px; color:#334155}
#cpfd summary{cursor:pointer; font-weight:700; color:var(--ink)}
#cpfd details li{max-width:90ch}
#cpfd .pin{font-size:11px; color:var(--accent); font-weight:700; margin-left:6px}
#cpfd .close{all:unset; cursor:pointer; float:right; font-size:12px; color:var(--ink3); padding:2px 6px; border-radius:5px; border:1px solid var(--line)}
</style>
</head>

  if (mode==='type' || !hasVal(n)) return n.kind==='step'?'var(--step)': n.kind==='util'?'var(--util)':'var(--io)';
  const t=scaleT(mode,n[mode]); return t==null?'#f1f5f9':rampAt(RAMPS[mode],0.08+0.92*t);
}
const strokeFor=n=> n.kind==='step'?'var(--stepS)': n.kind==='util'?'var(--utilS)':'var(--ioS)';

const el=(t,a,p)=>{ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); (p||svg).appendChild(e); return e; };
const defs=el('defs',{});
[['ar','#334155'],['arH','#ea580c'],['arU','#7c3aed']].forEach(([id,c])=>{ const m=el('marker',{id:'cp'+id,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},defs);
  el('path',{d:'M0,1 L10,5 L0,9 z',fill:c},m); });
const edgeEls = D.edges.map(([a,b,pts,u])=>{
  const p=el('polyline',{points:pts.map(q=>q.join(',')).join(' '),class:'e'+(u?' u':'')});
  if (b!=='UTIL') p.setAttribute('marker-end', u?'url(#cparU)':'url(#cpar)');
  p.dataset.a=a; p.dataset.b=b; p.dataset.u=u?1:0; return p; });
D.labels.forEach(([t,x,y,u])=>{ const e=el('text',{x,y,class:'lab'+(u?' u':''),'text-anchor':'middle'}); e.textContent=t; });

const nodeEls={};
NODES.forEach(n=>{
  const g=el('g',{class:'n',tabindex:0,role:'button','aria-label':n.title});
  let cx,cy;
  if(n.shape==='ellipse'){ el('ellipse',{cx:n.x,cy:n.y,rx:n.w,ry:n.h,class:'sh',stroke:strokeFor(n)},g); cx=n.x; cy=n.y; }
  else { el('rect',{x:n.x,y:n.y,width:n.w,height:n.h,rx:n.kind==='output'?4:8,class:'sh',stroke:strokeFor(n)},g); cx=n.x+n.w/2; cy=n.y+n.h/2; }
  const lines=n.lines, fs=n.fs||13, lh=fs*1.15, subFs=Math.max(9.5,fs*0.78);
  const block = lines.length*lh + (n.short? subFs*1.3:0) + (hasVal(n)? 15:0);
  let y = cy - block/2 + fs*0.85;
  lines.forEach(l=>{ const t=el('text',{x:cx,y,class:'id','text-anchor':'middle'},g); t.textContent=l; t.style.fontSize=fs+'px'; y+=lh; });
  let t2=null; if(n.short){ t2=el('text',{x:cx,y:y-lh+subFs*1.35,class:'sub','text-anchor':'middle'},g); t2.textContent=n.short; t2.style.fontSize=subFs+'px'; y+=subFs*1.3; }
  const tv=el('text',{x:cx,y:y+4,class:'val','text-anchor':'middle'},g);
  nodeEls[n.id]={g,sh:g.firstChild,tv};
  g.addEventListener('mouseenter',()=>{ if(!pinned) show(n.id); });
  g.addEventListener('focus',()=>show(n.id));
  g.addEventListener('mouseleave',()=>{ if(!pinned) overview(); });
  g.addEventListener('click',e=>{ e.stopPropagation(); pin(n.id); });
  g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault(); pin(n.id);} if(e.key==='Escape') unpin(); });
});
svg.addEventListener('click',()=>unpin());

function paint(){
  NODES.forEach(n=>{ const o=nodeEls[n.id]; o.sh.setAttribute('fill',fillFor(n));
    const show = mode!=='type' && hasVal(n); const t=scaleT(mode,n[mode]);
    o.tv.textContent = show ? valS(mode,n[mode]||0) : '';
    const dark = show && t!=null && t>0.6;
    o.g.querySelectorAll('text').forEach(tx=>tx.style.fill = dark ? '#fff' : '');
  });
  const lg=document.getElementById('legend');
  if(mode==='type') lg.innerHTML=`<span class="hint">Blue: process steps · Purple: shared utilities (dashed = supplies all steps) · Yellow: raw materials &amp; outputs. Click a box to pin it.</span>`;
  else { const mx=maxOf(mode); lg.innerHTML=`<span>${fmt(mx/1e3)}</span><div class="ramp" style="background:linear-gradient(90deg,${RAMPS[mode].join(',')})"></div><span>${fmt(mx)} ${UNITS[mode]} per kg coolant</span><span class="hint">(log scale; grey = none)</span>`; }
}
function highlight(id){
  svg.classList.toggle('dim',!!id);
  NODES.forEach(n=>nodeEls[n.id].g.classList.remove('rel','on'));
  edgeEls.forEach(e=>{ e.classList.remove('hl'); if(e.dataset.b!=='UTIL') e.setAttribute('marker-end', e.dataset.u==='1'?'url(#cparU)':'url(#cpar)'); });
  if(!id) return;
  const isU = byId[id].kind==='util';
  nodeEls[id].g.classList.add('rel','on');
  edgeEls.forEach(e=>{ const a=e.dataset.a, b=e.dataset.b;
    if(a===id||b===id||(isU&&a==='UTIL')){ e.classList.add('hl'); if(b!=='UTIL') e.setAttribute('marker-end','url(#cparH)');
      [a,b].forEach(x=>{ if(byId[x]) nodeEls[x].g.classList.add('rel'); }); }});
}
function show(id){
  const n=byId[id]; highlight(id);
  let h=`${pinned===id?'<button class="close" id="cpclose">Unpin ✕</button>':''}<div class="p-kind">${KIND[n.kind]}${pinned===id?'<span class="pin">· pinned</span>':''}</div>
    <div class="p-title">${n.title}</div><div class="p-sub">${n.sub}</div><p class="p-desc">${n.desc}</p>`;
  if (hasVal(n)){
    const pct=n.gwp/M.gwp*100;
    if (n.gwp < M.gwp*0.001 && n.zeroWhy){
      h+=`<div class="co2 zero"><div class="u">Carbon footprint <span class="src LCA">LCA</span></div><div class="big" style="font-size:18px">${gS(n.gwp)} <span class="u">CO₂-eq per kg coolant</span></div><small>${n.zeroWhy}</small></div>`;
    } else {
      h+=`<div class="co2"><div class="u">Carbon footprint (attributed) <span class="src LCA">LCA</span></div>
        <div class="big">${gS(n.gwp)} <span class="u">CO₂-eq per kg coolant</span></div>
        <div class="meter"><div style="width:${Math.max(pct,0.4)}%"></div></div><small>${fmt(pct,pct<1?2:1)} % of the ${fmt(M.gwp,2)} kg CO₂-eq total</small></div>`;
    }
    const c=(v,s,l)=>`<div class="cell${v>0.0005?'':' z'}"><b>${v>0.0005?s:'0'}</b><span>${l}</span></div>`;
    h+=`<div class="grid3">${c(n.fos,fmt(n.fos,n.fos>=10?1:2)+' MJ','Fossil energy')}${c(n.wat,fmt(n.wat,n.wat>=1?2:3)+' m³','Water use')}${c(n.luc,gS(n.luc),'Land-use CO₂')}</div>`;
    if (n.top && n.top.length) h+=`<h4>Largest contributing processes <span class="src LCA">LCA</span></h4><table>`+
      n.top.map(([p,v])=>`<tr><td>${p}</td><td class="r">${gS(v)}</td></tr>`).join('')+`</table>`;
  }
  if (n.facts && n.facts.length) h+=`<h4>Details</h4><table>`+n.facts.map(([l,v,s])=>`<tr><td>${l}${s?`<span class="src ${s}">${s==='Route'?'typical route':s}</span>`:''}</td><td class="r" style="white-space:normal">${v}</td></tr>`).join('')+`</table>`;
  if (n.note) h+=`<div class="sys">${n.note}</div>`;
  panel.innerHTML=h;
  const cb=document.getElementById('cpclose'); if(cb) cb.onclick=e=>{e.stopPropagation(); unpin();};
}
function overview(){
  highlight(null);
  const parts=M.parts, ranked=NODES.filter(hasVal).filter(n=>n.gwp>0).sort((a,b)=>b.gwp-a.gwp).slice(0,7), mx=ranked[0].gwp;
  panel.innerHTML=`<div class="p-kind">Overview</div><div class="p-title">Where the carbon footprint comes from</div>
    <p class="p-desc">Hover over a box in the diagram for details, or click one to pin it.</p>
    <h4>By source <span class="src LCA">LCA</span></h4>
    <div class="stack">${parts.map(([l,v,c])=>`<div style="width:${v/M.gwp*100}%;background:${c}" title="${l}"></div>`).join('')}</div>
    ${parts.map(([l,v,c])=>`<div class="sl"><i style="background:${c}"></i><span>${l}</span><b>${fmt(v/M.gwp*100,1)} %</b></div>`).join('')}
    <h4>Ranking (CO₂-eq per kg coolant)</h4>
    <ul class="rank">${ranked.map(u=>`<li data-id="${u.id}"><b>${u.rankName}</b><div class="t"><div style="width:${u.gwp/mx*100}%"></div></div><span class="v">${gS(u.gwp)}</span></li>`).join('')}</ul>
    <div class="sys">${M.takeaway}</div>`;
  panel.querySelectorAll('.rank li').forEach(li=>{ li.onmouseenter=()=>highlight(li.dataset.id); li.onmouseleave=()=>highlight(null);
    li.onclick=e=>{ e.stopPropagation(); pin(li.dataset.id); }; });
}
function pin(id){ pinned=(pinned===id)?null:id; pinned?show(id):overview(); }
function unpin(){ pinned=null; overview(); }
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{ mode=b.dataset.m;
  document.querySelectorAll('#modes button').forEach(x=>x.setAttribute('aria-pressed',x===b)); paint(); });
paint(); overview();
})();
</script>
</body>
</html>
